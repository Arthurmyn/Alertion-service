name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: e2e
        run: npx playwright test --pass-with-no-tests
        env:
          # Vite binds "localhost" on IPv6. Playwright waits on 127.0.0.1.
          NODE_OPTIONS: --dns-result-order=ipv4first
      - run: node scripts/check-copy.mjs
